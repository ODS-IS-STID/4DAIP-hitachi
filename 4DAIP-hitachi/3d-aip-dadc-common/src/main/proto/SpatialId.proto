syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.hitachi.tdaip.dadc.common";

package common;

service SpatialId {
	// f_get_spatial_ids_on_polygons
	rpc FGetSpatialIdsOnPolygons(GetSpatialIdsOnPolygonsRequest) returns (GetSpatialIdsResponse) {}
	// f_get_spatial_ids_on_points
	rpc FGetSpatialIdsOnPoints(FGetSpatialIdsOnPointsRequest) returns (GetSpatialIdsResponse) {}
	// f_get_point_on_spatial_id(spatial_id, Point_Option.VERTEX, crs)
	rpc FGetVertexPointOnSpatialId(FGetPointOnSpatialIdRequest2) returns (PointsResponse) {}
	// f_get_point_on_spatial_id(spatial_id, Point_Option.CENTER, crs)
	rpc FGetCenterPointOnSpatialId(FGetPointOnSpatialIdRequest2) returns (PointsResponse) {}
	
	rpc FGetSpatialIdsOnCylinders(FGetSpatialIdsOnCylindersRequest) returns (FGetSpatialIdsOnCylindersResponse) {}

	rpc FGetPointOnSpatialId(FGetPointOnSpatialIdRequest) returns (Point) {}
}

message SpatialIdentification { // 空間ID
    string ID = 1 ; // z/f/x/y
}

message Point { // missionController.Positionを使いませんか？
    double latitude = 1; // WGS84
    double longitude = 2; // WGS84
    float altitude = 3;
    AltitudeAttribute altitude_attribute = 4;

    enum AltitudeAttribute {
        ALTITUDE_ATTRIBUTE_ELIPSOIDE = 0; // WGS84
        ALTITUDE_ATTRIBUTE_MSL = 1; // ジオイド
        ALTITUDE_ATTRIBUTE_AGL = 2; // 地上高
    }
}

message Triangle {
	Point p1 = 1;
	Point p2 = 2;
	Point p3 = 3;
}

message GetSpatialIdsOnPolygonsRequest {
	repeated Triangle barrierTraiangles = 1;
	repeated Triangle spaceTriangles = 2;
	int32 zoom = 3;
	int32 crs = 4;
}

message FGetSpatialIdsOnPointsRequest {
	repeated Point points = 1;
	int32 zoom = 2;
	int32 crs = 3;
}

message FGetPointOnSpatialIdRequest2 {
	string spatialId = 1;
	int32 crs = 2;
}

message GetSpatialIdsResponse {
	repeated SpatialIdentification ids = 1;
}

message FGetSpatialIdsOnCylindersRequest {
	repeated Point pointList = 1;
	float radius = 2;
	int32 zoom = 3;
	int32 crs = 4;
	bool is_capsule = 5;
}

message PointsResponse {
	repeated Point point = 1;
}

message FGetSpatialIdsOnCylindersResponse {
	repeated SpatialIdentification ids = 1;
}

message FGetPointOnSpatialIdRequest {
	string spatialId = 1;
}


message FGetPointOnSpatialIdResponse {
	Point point = 1;
}
