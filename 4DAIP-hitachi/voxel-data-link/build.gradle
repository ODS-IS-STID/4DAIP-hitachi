task delombok(type: JavaExec, dependsOn: compileJava) {
    ext.outputDir = file("$buildDir/delombok")
    classpath = sourceSets.main.compileClasspath + sourceSets.main.output.generatedSourcesDirs
    main = 'lombok.launch.Main'
    args('delombok', 'src/main/java', '-d', outputDir)
    doFirst {
        outputDir.deleteDir()
    }
}

// JavadocでJava8以降のタグを出力するためのオプション
def javadocTagOptions = ["apiNote:a:API Note:", "implSpec:a:Implementation Requirements:", "implNote:a:Implementation Note:"]
// Javadoc生成時のクラスパス
def javadocClasspath = sourceSets.main.compileClasspath + sourceSets.main.output.generatedSourcesDirs + files("$buildDir/delombok")

javadoc {
    dependsOn([compileJava, delombok])
    options.charSet = 'UTF-8'
    options.encoding = 'UTF-8'
    options.docEncoding = 'UTF-8'
    failOnError = false
    classpath = javadocClasspath
    classpath += sourceSets.test.compileClasspath
    source = delombok.outputDir
    source +=sourceSets.test.allJava
    options.tags = javadocTagOptions
    //JavadocMemberLevelでアクセス修飾子を以下の
    //PACKAGE、PRIVATE、PROTECTED、PUBLICから選択可能
    //https://docs.gradle.org/current/javadoc/org/gradle/external/javadoc/JavadocMemberLevel.html
    options.setMemberLevel(JavadocMemberLevel.PACKAGE)
    //テストクラスのみのJavadocを出力する場合は以下のコメントを外す
    //includes = ['**/**Test.java']
    //出力するクラスの.javaを指定
    include(
        //メインクラス
        targetClasses.collect{it + '.java'}
//    +
        //テストクラス
//        targetClasses.collect{it + 'Test*.java'}
    )
}

// コンパイル時に使用する文字コードをUTF-8で固定する
tasks.withType(AbstractCompile).each { it.options.encoding = 'UTF-8' }
tasks.withType(Test) {
    systemProperty "file.encoding", "UTF-8"
}

test {
    //並列実行数
    maxParallelForks 4
    useJUnitPlatform()
    //テストクラスの.classを指定
    include(targetClasses.collect{it + 'Test*.class'})
//  include 'com/hitachi/tdaip/weatherandcopilot/provider/model/**/*Test.class'
//  testLogging {
//      events 'standard_out', 'standard_error'
//  }
}

test.finalizedBy jacocoTestReport

jacocoTestReport {
    reports {
        html.enabled = true
    }
    classDirectories.setFrom(classDirectories.files.collect {
    //メインクラスの.classを指定
      fileTree(dir: it, include: targetClasses.collect{it + '.class'})
    })
    doFirst {
       file(reports.html.outputLocation).deleteDir()
    }
}