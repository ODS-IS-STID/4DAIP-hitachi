buildscript {
    ext {
        springBootVersion = '3.2.4'
    }
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
    }
}

plugins {
    // SpringBootアップグレード
    id "org.openrewrite.rewrite" version "6.8.4"
//    id "io.spring.dependency-management" version "1.0.6.RELEASE"
}

apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'
apply plugin: 'jacoco'
// SpringBootアップグレード
apply plugin: "org.openrewrite.rewrite"

// SpringBootアップグレード
rewrite {
    activeRecipe("org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_2")
}

group = 'com.hitachi.tdaip'

version = '0.0.1'
sourceCompatibility = '17'

springBoot {
    mainClass = 'com.hitachi.tdaip.dronedomainapi.DroneDomainApiServiceApplication'
}

bootJar {
    launchScript()
}

configurations {
    developmentOnly
    runtimeClasspath {
        extendsFrom developmentOnly
    }
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starter
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework:spring-beans'
    implementation 'org.springframework:spring-webmvc'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.postgresql:postgresql'
    compileOnly 'org.apache.tomcat.embed:tomcat-embed-core'

    // RESTコントローラ用
    implementation 'org.springframework:spring-web'

    // Geometry操作用
    implementation 'org.locationtech.jts.io:jts-io-common:1.19.0'
    implementation 'org.locationtech.jts:jts-core:1.19.0'

    // Jsonbtype
    implementation 'javax.json.bind:javax.json.bind-api:1.0'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.14.1'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.14.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.14.1'

    // ログ出力
    implementation 'org.apache.commons:commons-lang3:3.12.0'

    //UT
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.2"
    // staticメソッドのモック化対応
    testImplementation 'org.mockito:mockito-inline:4.11.0'

    //Bearer認証（JWT:JSON Web Token）
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation "jakarta.validation:jakarta.validation-api:3.0.2"
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // SpringBootアップグレード
//    rewrite("org.openrewrite.recipe:rewrite-spring:5.5.0")

    implementation project(':3d-aip-common')
    implementation project(':mobility-integration-manage')
}

